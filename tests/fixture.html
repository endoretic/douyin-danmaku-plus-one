<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>弹幕 +1 · 本地交互测试</title>
  <script src="../extension/canvas-bridge.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #101116; color: #eef0f5; font: 15px/1.6 system-ui, sans-serif; }
    main { max-width: 1100px; margin: 36px auto; padding: 0 24px; }
    header { margin-bottom: 24px; }
    h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -.5px; }
    p { margin: 4px 0; color: #a2a7b4; }
    .tag { color: #64dfcf; font-size: 12px; letter-spacing: 1px; }
    .renderer { margin-top: 10px; font-size: 13px; color: #c4cbdc; }
    .renderer a { color: #64dfcf; margin-left: 12px; }
    .layout { display: grid; grid-template-columns: minmax(0, 720px) 280px; gap: 20px; }
    .player { position: relative; width: 100%; height: 405px; overflow: hidden; background: linear-gradient(125deg,#252b43,#172a31 55%,#33253e); border-radius: 16px; }
    video { display: block; width: 100%; height: 100%; background: transparent; }
    .scene { position: absolute; bottom: 28px; left: 24px; pointer-events: none; color: #ffffff40; }
    .scene strong { display: block; font-size: 46px; line-height: 1; }
    .scene span { font-size: 13px; color: #c3c6d977; }
    .CanvasDanmakuPlugin { position: absolute; inset: 0; pointer-events: none; }
    canvas { width: 100%; height: 100%; display: block; }
    xg-danmu { display: block; position: absolute; inset: 0; pointer-events: none; }
    xg-danmu div { position: absolute; left: 42px; top: 212px; color: white; font: bold 24px sans-serif; white-space: nowrap; text-shadow: 1px 1px 3px #000; }
    aside { background: #191b23; border: 1px solid #2b2e39; border-radius: 16px; padding: 18px; }
    aside h2 { font-size: 16px; margin: 0 0 12px; }
    #sent-log { min-height: 185px; max-height: 220px; overflow: auto; margin: 0 0 14px; padding-left: 20px; color: #75e5d4; overflow-wrap: anywhere; }
    #chatInput { display: flex; gap: 8px; align-items: center; border-top: 1px solid #30333e; padding-top: 14px; }
    [data-e2e="live-chatting"] { flex: 1; min-width: 0; }
    .zone-container { min-height: 48px; max-height: 100px; overflow-y: auto; padding: 10px; background: #11131b; border: 1px solid #3a3e4d; border-radius: 8px; outline: none; overflow-wrap: anywhere; }
    .zone-container:focus { border-color: #64dfcf; }
    .webcast-chatroom___send-btn { flex: 0 0 32px; cursor: pointer; color: #fe356c; }
    .webcast-chatroom___send-btn.disable { color: #4d5261; cursor: not-allowed; }
    .controls { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
    button { border: 1px solid #3a3e4d; border-radius: 8px; background: #222532; color: #e9ecf4; padding: 8px 12px; cursor: pointer; font: inherit; }
    button:hover { border-color: #64dfcf; }
    #fixture-status { padding: 12px 14px; margin-top: 16px; background: #191d28; border-left: 3px solid #64dfcf; color: #bfc7d9; }
    .note { font-size: 13px; margin-top: 14px; }
    @media(max-width: 880px) { .layout { grid-template-columns: 1fr; } .player { height: 360px; } }
  </style>
</head>
<body>
  <main>
    <header><div class="tag">LOCAL FIXTURE · 不连接抖音</div><h1>点击一句弹幕，再 +1</h1><p>模拟 Canvas 缓存绘制、直接绘制、旧版 DOM 弹幕与直播编辑器。所有发送仅留在此页。</p><div class="renderer"><span id="renderer-status" role="status">正在初始化绘制器…</span><a href="fixture.html">普通模式</a><a href="fixture.html?renderer=worker">Worker 模式测试</a></div></header>
    <section class="layout">
      <div>
        <div class="player" id="fixture-player">
          <video id="fixture-video" muted aria-label="模拟直播画面"></video>
          <div class="scene"><strong>LIVE / 01</strong><span>Canvas × 2 分辨率 · 鼠标点击弹幕测试</span></div>
          <div class="CanvasDanmakuPlugin"><canvas id="danmaku-canvas" width="1440" height="810"></canvas></div>
          <xg-danmu><div data-danmu-id="fixture-dom">这是一条 DOM 弹幕</div></xg-danmu>
        </div>
        <div class="controls">
          <button id="toggle-motion">开启移动</button><button id="toggle-canvas">隐藏 Canvas</button><button id="clear-canvas">清空 Canvas</button><button id="restore-canvas">恢复弹幕</button><button id="switch-room">切换房间</button>
          <button id="set-draft">填入已有草稿</button><button id="clear-draft">清空草稿</button><button id="toggle-failure">模拟发送失败：关</button>
        </div>
        <p id="fixture-status" role="status">测试就绪。第一行使用缓存画布，第二行直接绘制，第三行是 DOM 弹幕。</p>
      </div>
      <aside>
        <h2>本地发送记录 · <span id="send-count">0</span> 条</h2>
        <ol id="sent-log" aria-live="polite"></ol>
        <div class="webcast-chatroom___input-container" id="chatInput">
          <div data-e2e="live-chatting">
            <div class="zone-container editor-kit-container" contenteditable="true" data-slate-editor="true" data-placeholder="与大家互动一下..." role="textbox" aria-label="直播聊天输入框"><div class="ace-line" data-node="true"><span data-string="true" data-enter="true" data-leaf="true">&#8203;</span></div></div>
          </div>
          <svg role="button" aria-label="发送聊天" tabindex="0" type="button" class="webcast-chatroom___send-btn btn-icon disable" disabled="" viewBox="0 0 32 32" width="32" height="32"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 24V8m-6 6 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </div>
        <p class="note">SVG 发送按钮与现场 DOM 一致。失败模式保留输入；切换房间用于检查旧选择失效。</p>
      </aside>
    </section>
  </main>
  <script src="../extension/site-adapter.js"></script>
  <script src="../extension/content.js"></script>
  <script src="fixture.js"></script>
</body>
</html>
